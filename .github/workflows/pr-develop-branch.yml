name: Validate PR on main branch

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "force-app/**"

jobs:
  validate-deployment-on-develop-org:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Checkout source code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install Salesforce CLI"
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: "Install sfdx-git-delta"
        run: |
          echo y | sf plugins install sfdx-git-delta
          sf plugins

      - name: "Install Java (for scanner)"
        run: |
          sudo apt-get update
          sudo apt install -y default-jdk

      - name: "Install SFDX Code Analyzer"
        run: echo y | sf plugins install @salesforce/sfdx-scanner

      - name: "Populate auth file with SFDX_URL secret"
        run: echo "${{ secrets.SFDX_INTEGRATION_URL }}" > ./SFDX_INTEGRATION_URL.txt

      - name: "Authenticate to Integration Org"
        run: sf org login sfdx-url --sfdx-url-file ./SFDX_INTEGRATION_URL.txt --alias integration --set-default

      - name: "Create delta packages"
        run: |
          mkdir -p changed-sources
          sf sgd source delta --to "HEAD" --from "HEAD^1" --output changed-sources/ --generate-delta --source force-app/
          echo "--- 변경된 메타데이터 ---"
          find changed-sources/force-app -type f 2>/dev/null | sort || echo "(변경 없음)"

      - name: "Scan Apex (skip if no .cls files)"
        run: |
          CLS_COUNT=$(find changed-sources/force-app -name "*.cls" 2>/dev/null | wc -l)
          if [ "$CLS_COUNT" -gt "0" ]; then
            cd changed-sources
            sf scanner run --format sarif --target './**/*.cls' --category "Design,Best Practices,Performance" --outfile apexScanResults.sarif
            cd ..
          else
            echo "Apex 클래스 변경 없음 — 스캔 스킵"
          fi

      - name: "Upload SARIF (if exists)"
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: changed-sources/apexScanResults.sarif
        continue-on-error: true

      - name: "Check-only deploy delta (dry-run)"
        run: |
          if [ -d "changed-sources/force-app" ] && [ "$(ls -A changed-sources/force-app 2>/dev/null)" ]; then
            sf project deploy start \
              --source-dir "changed-sources/force-app" \
              --dry-run \
              --test-level NoTestRun \
              --target-org integration \
              --json
          else
            echo "배포할 변경사항 없음 — 스킵"
          fi

      - name: "Deploy destructive changes (if any)"
        run: |
          if [ -f "changed-sources/destructiveChanges/destructiveChanges.xml" ]; then
            sf project deploy start \
              --metadata-dir "changed-sources/destructiveChanges" \
              --dry-run \
              --ignore-warnings \
              --target-org integration \
              --json
          else
            echo "destructiveChanges 없음 — 스킵"
          fi
