<template>
    <div class="sc-wrap">
        <!-- 헤더 -->
        <div class="sc-hl">
            <div class="sc-hl-head">
                <span class="sc-hl-icon">SC</span>
                <div class="sc-hl-title">
                    <p class="sc-hl-eyebrow">Service Contract · 아이온데이터</p>
                    <h1 class="sc-hl-name">아이온데이터 CDU SLA 보증 계약</h1>
                </div>
                <div class="sc-hl-actions">
                    <template lwc:if={opportunityCreated}>
                        <button type="button" class="renew-done" disabled>갱신 Opportunity 생성됨</button>
                    </template>
                    <template lwc:else>
                        <lightning-button label="갱신 Opportunity 생성" variant="brand"
                            onclick={handleCreateOpportunity}></lightning-button>
                    </template>
                </div>
            </div>
            <dl class="sc-hl-fields">
                <div class="sc-hl-f"><dt>상태</dt><dd><span class="slds-badge sc-badge-ok">Active</span></dd></div>
                <div class="sc-hl-f"><dt>계약 종료일</dt><dd class="num">2026-09-30</dd></div>
                <div class="sc-hl-f"><dt>갱신까지</dt><dd class="num sc-warn">D-61</dd></div>
                <div class="sc-hl-f"><dt>담당자</dt><dd>나세일</dd></div>
            </dl>
        </div>

        <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
            <!-- 중앙: 계약 정보 + 서비스 운영 성과 -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
                <lightning-card>
                    <span slot="title" class="slds-text-heading_small">계약 정보</span>
                    <div class="slds-p-horizontal_small slds-p-bottom_small">
                        <dl class="kv">
                            <div class="kv-row"><dt>계약 시작일</dt><dd class="num">2022-06-09</dd></div>
                            <div class="kv-row"><dt>계약 종료일</dt><dd class="num">2026-09-30</dd></div>
                            <div class="kv-row"><dt>계약 범위</dt><dd>유지보수 · SLA 보증</dd></div>
                            <div class="kv-row"><dt>대상 장비</dt><dd>CDU 12대 + CX 4대 · 16대</dd></div>
                            <div class="kv-row"><dt>응답 SLA</dt><dd class="num">30분</dd></div>
                            <div class="kv-row"><dt>복구 SLA</dt><dd class="num">8시간</dd></div>
                            <div class="kv-row"><dt>계약 금액</dt><dd class="num">0.9억/년</dd></div>
                            <div class="kv-row"><dt>계약 상태</dt><dd><span class="slds-badge sc-badge-ok">Active</span></dd></div>
                        </dl>
                    </div>
                </lightning-card>

                <lightning-card class="slds-m-top_small sc-perf-card">
                    <span slot="title" class="slds-text-heading_small">서비스 운영 성과</span>
                    <span slot="actions" class="slds-badge sc-badge-agent">앞 장면 데이터</span>
                    <div class="slds-p-horizontal_small slds-p-bottom_small">
                        <dl class="kv">
                            <div class="kv-row"><dt>최근 Case</dt><dd class="num">00001042</dd></div>
                            <div class="kv-row"><dt>최근 복구시간</dt><dd class="num">4시간 10분</dd></div>
                            <div class="kv-row"><dt>기존 대비</dt><dd class="num sc-green">39% 단축</dd></div>
                            <div class="kv-row"><dt>RCA</dt><dd><span class="slds-badge sc-badge-ok">완료</span> PRB-0091</dd></div>
                            <div class="kv-row"><dt>시정조치</dt><dd class="num">1건</dd></div>
                            <div class="kv-row"><dt>예방점검</dt><dd class="num">11건 생성/완료</dd></div>
                            <div class="kv-row"><dt>미해결 중대 Case</dt><dd class="num sc-green">0건</dd></div>
                        </dl>
                    </div>
                </lightning-card>

                <template lwc:if={opportunityCreated}>
                    <div class="callout co-green slds-m-top_small">
                        <span class="co-ico">&#x2713;</span>
                        <div><strong>갱신 Opportunity가 생성되었습니다</strong>
                            계약과 최근 서비스 성과가 영업 검토 근거로 연결되었습니다. Task 상태가 <b>완료</b>로 바뀌었습니다.</div>
                    </div>
                </template>
            </div>

            <!-- 우측: 추가 성장 신호 + 자동화 경계 -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                <lightning-card>
                    <span slot="title" class="slds-text-heading_small">추가 성장 신호</span>
                    <span slot="actions" class="slds-badge sc-badge-neutral">참고</span>
                    <div class="slds-p-horizontal_small slds-p-bottom_small">
                        <div class="rl">
                            <div class="rl-row">
                                <div class="rl-main">
                                    <div class="rl-t">Hall B 확장 문의</div>
                                    <div class="rl-s">2026-03-04 · 갱신 협의 시 확장 계획 확인 필요</div>
                                </div>
                            </div>
                        </div>
                        <lightning-button label="확장 계획 확인" disabled
                            class="slds-m-top_small" style="width:100%"></lightning-button>
                    </div>
                </lightning-card>

            </div>
        </div>
    </div>
</template>
