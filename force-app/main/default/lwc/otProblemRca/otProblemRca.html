<template>
    <div class="slds-p-vertical_x-small">
        <!-- ── Path 바 (path:5 = RCA·예방·지식 on) ── -->
        <c-ot-case-path record-id={effectiveRecordId}></c-ot-case-path>

        <!-- ── 서브탭 (RCA 활성) ── -->
        <div class="subtabs">
            <button class="subtab" data-goto="case" onclick={handleSubtab}>Case</button>
            <button class="subtab" data-goto="c__t5Customer360" onclick={handleSubtab}>Customer 360</button>
            <button class="subtab" data-goto="c__otDispatchBriefingWorkbench" onclick={handleSubtab}>출동 브리핑</button>
            <button class="subtab" data-goto="c__otDispatchCandidates" onclick={handleSubtab}>담당자 확정</button>
            <button class="subtab" data-goto="c__otCauseConfirm" onclick={handleSubtab}>원인확정</button>
            <button class="subtab on">RCA</button>
            <button class="subtab" data-goto="c__otActionResults" onclick={handleSubtab}>조치</button>
            <button class="subtab">협업 로그</button>
        </div>

        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
        </template>

        <template lwc:if={error}>
            <div class="slds-text-color_error slds-p-around_small" role="alert">
                {errorMessage}
            </div>
        </template>

        <template lwc:if={rca}>
            <!-- ── 하이라이트 ── -->
            <div class="rca-hl">
                <div class="rca-hl-head">
                    <span class="rca-hl-icon icon-crit">P</span>
                    <div class="rca-hl-title">
                        <p class="rca-hl-eyebrow">Problem {problemNumber} · Case {caseNumber}에서 생성</p>
                        <h1 class="rca-hl-name">{rcaSubject}</h1>
                    </div>
                    <div class="rca-hl-actions">
                        <lightning-button label="RCA·범위 확정 저장" variant="brand"
                            onclick={handleSaveRca}></lightning-button>
                    </div>
                </div>
                <dl class="rca-hl-fields">
                    <div class="rca-hl-f"><dt>시정조치</dt><dd class="num">{correctiveCount}건</dd></div>
                    <div class="rca-hl-f"><dt>예방확인</dt><dd class="num">{preventiveCount}건</dd></div>
                </dl>
            </div>

            <div class="slds-m-top_small">
                <lightning-card>
                    <span slot="title" class="slds-text-heading_small">원인 구분</span>
                    <span slot="actions" class="slds-badge rca-badge-human">담당자 확정</span>
                    <div class="slds-p-horizontal_medium slds-p-bottom_medium co-stack">
                        <div class="callout co-crit">
                            <span class="co-ico">→</span>
                            <div><strong>직접 원인</strong>{directCause}</div>
                        </div>
                        <div class="callout co-warn">
                            <span class="co-ico">⚑</span>
                            <div><strong>조직 차원의 근본원인</strong>{rootCause}</div>
                        </div>
                    </div>
                </lightning-card>
            </div>
        </template>
    </div>
</template>
