<template>
    <div class="wb">
        <template lwc:if={isLoading}>
            <div class="loading">
                <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={error}>
            <div class="error" role="alert">{errorMessage}</div>
        </template>

        <template lwc:if={rca}>
            <!-- RCA 상태 스트립 + CTA -->
            <div class="meta">
                <dl class="meta__list">
                    <div class="meta__item">
                        <dt>승인 상태</dt>
                        <dd><span class={approvalStatusClass}>{approvalStatus}</span></dd>
                    </div>
                    <div class="meta__item">
                        <dt>승인 담당</dt>
                        <dd>{approvalOwnerLabel}</dd>
                    </div>
                    <div class="meta__item">
                        <dt>초안 근거</dt>
                        <dd class="num">Case {caseNumber}</dd>
                    </div>
                    <div class="meta__item">
                        <dt>현장 근거</dt>
                        <dd class="num">{evidenceSummary}</dd>
                    </div>
                </dl>
                <div class="meta__actions">
                    <button type="button" class="btn btn--primary"
                        onclick={handleApprove} disabled={approveButtonDisabled}>
                        {approveButtonLabel}
                    </button>
                </div>
            </div>

            <div class="grid">
                <!-- 원인 구분 -->
                <section class="card col--main">
                    <header class="card__head">
                        <h3 class="card__title">원인 구분</h3>
                    </header>
                    <div class="card__body cause-stack">
                        <div class="cause cause--direct">
                            <span class="cause__ico" aria-hidden="true">→</span>
                            <div class="cause__body">
                                <p class="cause__label">직접 원인</p>
                                <p class="cause__text">{directCause}</p>
                                <p class="cause__note">
                                    근거 · 현장 측정 <span class="num">{evidenceFailValue} N·m 불합격</span>
                                    → 재조임 <span class="num">{evidencePassValue} N·m 합격</span>
                                </p>
                            </div>
                        </div>
                        <div class="cause cause--root">
                            <span class="cause__ico" aria-hidden="true">⚑</span>
                            <div class="cause__body">
                                <p class="cause__label">조직 차원 근본 원인</p>
                                <p class="cause__text">{rootCause}</p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 판단 단위 비교 -->
                <section class="card col--side">
                    <header class="card__head">
                        <h3 class="card__title">판단 단위 비교</h3>
                    </header>
                    <div class="card__body-tight">
                        <ul class="scope">
                            <li class="scope__item">
                                <p class="scope__label">A-07 특수 조건</p>
                                <p class="scope__evidence">Rev.B · F-07 · 동일 위치 재발</p>
                                <p class="scope__question">→ 원인 위치 확정</p>
                                <p class="scope__result">
                                    <span class="chip chip--neg">시정조치 {correctiveCount}건</span>
                                </p>
                            </li>
                            <li class="scope__item">
                                <p class="scope__label">12대 공통 조건</p>
                                <p class="scope__evidence">동일 프로젝트 · 시공 · 규격 · 점검 기준 누락</p>
                                <p class="scope__question">→ 예방 범위 확정</p>
                                <p class="scope__result">
                                    <span class="chip chip--warn">예방확인 {preventiveCount}건</span>
                                </p>
                            </li>
                        </ul>
                    </div>
                </section>
            </div>
        </template>
    </div>
</template>
