<template>
    <div class="ms-panel">

        <template lwc:if={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={hasError}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-around_x-small" role="alert">
                <span class="slds-assistive-text">오류</span>
                <lightning-icon icon-name="utility:error" alternative-text="오류" size="x-small"
                    class="slds-m-right_x-small"></lightning-icon>
                {errorMessage}
            </div>
        </template>

        <template lwc:if={info}>
            <!-- ── 하이라이트 스트립 ── -->
            <div class="ms-hl">
                <div class="ms-hl-head">
                    <div class="ms-hl-icon-wrap">
                        <lightning-icon icon-name="standard:messaging_session" size="small"
                            alternative-text="Messaging Session"></lightning-icon>
                    </div>
                    <div class="ms-hl-title">
                        <p class="ms-hl-eyebrow">MessagingSession · {info.channelLabel}</p>
                        <h1 class="ms-hl-name">{sessionTitle}</h1>
                    </div>
                    <div class="ms-hl-badge-wrap">
                        <span class={statusBadgeClass}>{info.status}</span>
                    </div>
                </div>

                <div class="ms-hl-metrics">
                    <div class="ms-hl-metric">
                        <span class="ms-hl-metric-label">시작</span>
                        <span class="ms-hl-metric-value">{startTimeText}</span>
                    </div>
                    <div class="ms-hl-metric">
                        <span class="ms-hl-metric-label">종료</span>
                        <span class="ms-hl-metric-value">{endTimeText}</span>
                    </div>
                    <div class="ms-hl-metric">
                        <span class="ms-hl-metric-label">채널 유형</span>
                        <span class="ms-hl-metric-value">{info.channelType}</span>
                    </div>
                    <div class="ms-hl-metric">
                        <span class="ms-hl-metric-label">유입 경로</span>
                        <span class="ms-hl-metric-value">{info.origin}</span>
                    </div>
                </div>
            </div>

            <!-- ── 탭셋 ── -->
            <div class="ms-tabs">
                <div class="ms-tabs-nav" role="tablist">
                    <button class={tab0Class} role="tab" aria-selected={isTab0} data-idx="0"
                        onclick={handleTabClick}>세션 정보</button>
                    <button class={tab1Class} role="tab" aria-selected={isTab1} data-idx="1"
                        onclick={handleTabClick}>Messaging User</button>
                    <button class={tab2Class} role="tab" aria-selected={isTab2} data-idx="2"
                        onclick={handleTabClick}>Case</button>
                </div>

                <!-- 탭 0: 세션 정보 -->
                <div class="ms-tab-panel" role="tabpanel" lwc:if={isTab0}>
                    <dl class="ms-field-grid">
                        <div class="ms-field">
                            <dt>상태</dt>
                            <dd><span class={statusBadgeClass}>{info.status}</span></dd>
                        </div>
                        <div class="ms-field">
                            <dt>채널</dt>
                            <dd>{info.channelLabel}</dd>
                        </div>
                        <div class="ms-field">
                            <dt>채널 유형</dt>
                            <dd>{info.channelType}</dd>
                        </div>
                        <div class="ms-field">
                            <dt>유입 경로</dt>
                            <dd>{info.origin}</dd>
                        </div>
                        <div class="ms-field">
                            <dt>시작 시간</dt>
                            <dd>{startTimeText}</dd>
                        </div>
                        <div class="ms-field">
                            <dt>종료 시간</dt>
                            <dd>{endTimeText}</dd>
                        </div>
                        <div class="ms-field ms-field--full">
                            <dt>Preview Details</dt>
                            <dd>{info.previewDetails}</dd>
                        </div>
                    </dl>
                </div>

                <!-- 탭 1: Messaging User -->
                <div class="ms-tab-panel" role="tabpanel" lwc:if={isTab1}>
                    <dl class="ms-field-grid">
                        <div class="ms-field">
                            <dt>이름</dt>
                            <dd>{info.endUserName}</dd>
                        </div>
                        <div class="ms-field">
                            <dt>Message Type</dt>
                            <dd>{info.channelType}</dd>
                        </div>
                        <div class="ms-field">
                            <dt>Consent Status</dt>
                            <dd><span class={consentBadgeClass}>{info.endUserConsentStatus}</span></dd>
                        </div>
                        <template lwc:if={info.contactId}>
                            <div class="ms-field">
                                <dt>연결 Contact</dt>
                                <dd>
                                    <a href={contactUrl} onclick={handleContactClick}>{info.contactName}</a>
                                </dd>
                            </div>
                        </template>
                        <div class="ms-field ms-field--full">
                            <dt>Messaging Platform Key</dt>
                            <dd class="ms-platform-key">{info.endUserPlatformKey}</dd>
                        </div>
                    </dl>
                </div>

                <!-- 탭 2: Case -->
                <div class="ms-tab-panel" role="tabpanel" lwc:if={isTab2}>
                    <template lwc:if={info.caseId}>
                        <dl class="ms-field-grid">
                            <div class="ms-field">
                                <dt>Case 번호</dt>
                                <dd>
                                    <a href={caseUrl} onclick={handleCaseClick} class="ms-case-link">
                                        {info.caseNumber}
                                    </a>
                                </dd>
                            </div>
                            <div class="ms-field">
                                <dt>상태</dt>
                                <dd><span class="slds-badge">{info.caseStatus}</span></dd>
                            </div>
                            <div class="ms-field">
                                <dt>Priority</dt>
                                <dd>{info.casePriority}</dd>
                            </div>
                            <div class="ms-field">
                                <dt>담당자</dt>
                                <dd>{info.caseOwnerName}</dd>
                            </div>
                            <div class="ms-field">
                                <dt>Account</dt>
                                <dd>{info.accountName}</dd>
                            </div>
                            <div class="ms-field ms-field--full">
                                <dt>Subject</dt>
                                <dd>{info.caseSubject}</dd>
                            </div>
                        </dl>
                        <div class="ms-case-actions">
                            <lightning-button
                                label="Case 서브탭 열기"
                                icon-name="utility:new_window"
                                icon-position="left"
                                onclick={handleOpenCaseSubtab}
                                variant="base">
                            </lightning-button>
                        </div>
                    </template>

                    <template lwc:else>
                        <div class="ms-empty-case">
                            <lightning-icon icon-name="utility:case" size="large"
                                alternative-text="Case 없음" class="ms-empty-icon"></lightning-icon>
                            <p class="ms-empty-text">연결된 Case가 없습니다</p>
                            <lightning-button
                                label="새 Case 생성"
                                icon-name="utility:add"
                                icon-position="left"
                                variant="brand"
                                onclick={handleNewCase}>
                            </lightning-button>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</template>
