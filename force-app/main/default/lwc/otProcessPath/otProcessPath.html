<template>
    <template lwc:if={hasSteps}>
        <nav class="path" aria-label="프로세스 진행 상태">
            <ol class="path__list">
                <template for:each={steps} for:item="s">
                    <li key={s.key} class={s.cls}>
                        <span class={s.iconCls} aria-hidden="true">
                            <template lwc:if={s.showCheck}>✓</template>
                            <template lwc:else>{s.num}</template>
                        </span>
                        <span class="step__label">{s.label}</span>
                    </li>
                </template>
            </ol>
        </nav>
    </template>
</template>
