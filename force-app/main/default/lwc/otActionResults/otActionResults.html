<template>
    <div class="slds-p-vertical_x-small">
        <!-- ── Path 바 (path:5 = RCA·예방·지식 on) ── -->
        <div class="path">
            <div class="path-step done"><span class="path-num">0</span> 접수</div>
            <div class="path-step done"><span class="path-num">1</span> 진단·브리핑</div>
            <div class="path-step done"><span class="path-num">2</span> 담당자 배정</div>
            <div class="path-step done"><span class="path-num">3</span> 현장 출동</div>
            <div class="path-step done"><span class="path-num">4</span> 수리·복구</div>
            <div class="path-step on"><span class="path-num">5</span> RCA·예방·지식</div>
        </div>

        <!-- ── 서브탭 (조치 활성) ── -->
        <div class="subtabs">
            <button class="subtab" data-goto="case" onclick={handleSubtab}>Case</button>
            <button class="subtab" data-goto="c__t5Customer360" onclick={handleSubtab}>Customer 360</button>
            <button class="subtab" data-goto="c__otDispatchBriefingWorkbench" onclick={handleSubtab}>출동 브리핑</button>
            <button class="subtab" data-goto="c__otDispatchCandidates" onclick={handleSubtab}>담당자 확정</button>
            <button class="subtab" data-goto="c__otCauseConfirm" onclick={handleSubtab}>원인확정</button>
            <button class="subtab" data-goto="c__otProblemRca" onclick={handleSubtab}>RCA</button>
            <button class="subtab on">조치</button>
            <button class="subtab">협업 로그</button>
        </div>

        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
        </template>

        <template lwc:if={error}>
            <div class="slds-text-color_error slds-p-around_small" role="alert">
                {errorMessage}
            </div>
        </template>

        <template lwc:if={actions}>
            <!-- ── 하이라이트 ── -->
            <div class="action-hl">
                <div class="action-hl-head">
                    <span class="action-hl-icon">✓</span>
                    <div class="action-hl-title">
                        <p class="action-hl-eyebrow">승인 범위로 작업 생성됨 · Problem {problemNumber}</p>
                        <h1 class="action-hl-name">시정 {correctiveCount}건 · 예방 {preventiveCount}건 · 합계 {totalCount}건</h1>
                    </div>
                </div>
                <dl class="action-hl-fields">
                    <div class="action-hl-f"><dt>시정조치</dt><dd class="num">{correctiveCount}건</dd></div>
                    <div class="action-hl-f"><dt>예방확인</dt><dd class="num">{preventiveCount}건</dd></div>
                    <div class="action-hl-f"><dt>합계</dt><dd class="num">{totalCount}건</dd></div>
                </dl>
            </div>

            <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                <!-- 중앙: 생성된 WO + 점검표 개정 -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
                    <lightning-card>
                        <span slot="title" class="slds-text-heading_small">생성된 Work Order</span>
                        <span slot="actions" class="slds-badge rca-badge-rule">PRI_ Flow</span>
                        <div class="slds-p-horizontal_small slds-p-bottom_small">
                            <template lwc:if={hasWorkOrders}>
                                <div class="rl">
                                    <template for:each={workOrders} for:item="wo">
                                        <div key={wo.workOrderNumber} class="rl-row">
                                            <span class={wo.badgeClass}>{wo.badgeLabel}</span>
                                            <div class="rl-main">
                                                <div class="rl-t">{wo.workOrderNumber} · {wo.subject}</div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-body_small slds-text-color_weak">생성된 Work Order가 없습니다.</p>
                            </template>
                        </div>
                    </lightning-card>

                    <lightning-card class="slds-m-top_small">
                        <span slot="title" class="slds-text-heading_small">점검표 개정</span>
                        <span slot="actions" class="slds-badge scope-preventive">Rev.2 → Rev.3</span>
                        <div class="slds-p-horizontal_small slds-p-bottom_small">
                            <table class="tbl">
                                <thead>
                                    <tr>
                                        <th>점검 항목</th>
                                        <th>Rev.2</th>
                                        <th>Rev.3</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={checklistRows} for:item="row">
                                        <tr key={row.key}>
                                            <td><b>{row.item}</b></td>
                                            <td>{row.rev2}</td>
                                            <td>
                                                <template lwc:if={row.isNew}>
                                                    <span class="slds-badge scope-new">{row.rev3}</span>
                                                </template>
                                                <template lwc:else>
                                                    {row.rev3}
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </lightning-card>
                </div>

                <!-- 우측: Knowledge 초안 -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                    <lightning-card class="kb-card">
                        <span slot="title" class="slds-text-heading_small">Knowledge 초안</span>
                        <span slot="actions" class="slds-badge rca-badge-agent">Agent 제안</span>
                        <div class="slds-p-horizontal_small slds-p-bottom_small">
                            <p class="kb-lead">이번 해결 내용은 기존 Knowledge와 완전히 같은 사례가 아니었습니다.</p>

                            <div class="kb-inner">
                                <dl class="kb-kv">
                                    <div><dt>근거</dt><dd>{evidenceSource}</dd></div>
                                    <div><dt>원기록</dt><dd class="num">{commissionText}</dd></div>
                                    <div><dt>측정</dt><dd class="num">{recoveryText}</dd></div>
                                    <div><dt>공개 범위</dt><dd><span class="slds-badge">검토 필요</span></dd></div>
                                </dl>
                            </div>

                            <div class="kb-actions">
                                <lightning-button label="등록 검토" variant="brand"></lightning-button>
                                <lightning-button label="보류"></lightning-button>
                            </div>
                            <p class="kb-note">자동으로 게시하지 않습니다. 최종 판단은 담당자에게 남깁니다.</p>
                        </div>
                    </lightning-card>
                </div>
            </div>
        </template>
    </div>
</template>
