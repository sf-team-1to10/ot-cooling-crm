<template>
    <div class="wb">
        <template lwc:if={isLoading}>
            <div class="loading">
                <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={error}>
            <div class="error" role="alert">{errorMessage}</div>
        </template>

        <template lwc:if={actions}>
            <!-- 승인 결과 배너 -->
            <div class="banner">
                <div class="banner__ico" aria-hidden="true">✓</div>
                <div class="banner__body">
                    <p class="banner__label">서비스 관리자 승인 결과</p>
                    <p class="banner__text">
                        <template lwc:if={isApproved}>
                            서비스 관리자 승인으로 시정·예방 조치 <span class="num">{totalCount}</span>건이 생성됐습니다.
                        </template>
                        <template lwc:else>
                            원인 분석 탭에서 시정·예방 계획을 승인하면 조치 목록이 이 화면에 생성됩니다.
                        </template>
                    </p>
                </div>
                <div class="banner__status">
                    <span class={approvalStatusClass}>{approvalStatus}</span>
                </div>
            </div>

            <!-- KPI 3카드 -->
            <div class="kpi-grid">
                <div class="kpi kpi--corr">
                    <p class="kpi__value num">{correctiveCount}</p>
                    <p class="kpi__label">시정조치</p>
                </div>
                <div class="kpi kpi--prev">
                    <p class="kpi__value num">{preventiveCount}</p>
                    <p class="kpi__label">예방확인</p>
                </div>
                <div class="kpi kpi--total">
                    <p class="kpi__value num">{totalCount}</p>
                    <p class="kpi__label">합계</p>
                </div>
            </div>

            <div class="grid">
                <!-- 생성된 WO 리스트 -->
                <section class="card col--main">
                    <header class="card__head">
                        <h3 class="card__title">생성된 Work Order</h3>
                        <span class="chip chip--info num">{totalCount}건</span>
                    </header>
                    <div class="card__body-tight">
                        <template lwc:if={hasWorkOrders}>
                            <ul class="wo-list">
                                <template for:each={workOrders} for:item="wo">
                                    <li key={wo.workOrderNumber} class={wo.rowClass}>
                                        <span class={wo.badgeClass}>{wo.badgeLabel}</span>
                                        <div class="wo-main">
                                            <p class="wo-num num">{wo.workOrderNumber}</p>
                                            <p class="wo-subject">{wo.subject}</p>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:else>
                            <p class="empty">생성된 Work Order가 없습니다.</p>
                        </template>
                    </div>
                </section>

                <!-- 점검표 개정 -->
                <section class="card col--side">
                    <header class="card__head">
                        <h3 class="card__title">점검표 개정</h3>
                        <span class="rev-badge">
                            <span class="rev-badge__from">Rev.2</span>
                            <span class="rev-badge__arrow" aria-hidden="true">→</span>
                            <span class="rev-badge__to">Rev.3</span>
                        </span>
                    </header>
                    <div class="card__body-tight">
                        <table class="tbl">
                            <thead>
                                <tr>
                                    <th>점검 항목</th>
                                    <th>Rev.2</th>
                                    <th>Rev.3</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={checklistRows} for:item="row">
                                    <template lwc:if={row.isNew}>
                                        <tr key={row.key} class="tbl__row--new">
                                            <td>
                                                <span class="new-mark" aria-hidden="true">★</span>
                                                <strong>{row.item}</strong>
                                            </td>
                                            <td class="text-muted">{row.rev2}</td>
                                            <td><span class="chip chip--pos">{row.rev3}</span></td>
                                        </tr>
                                    </template>
                                    <template lwc:else>
                                        <tr key={row.key}>
                                            <td>{row.item}</td>
                                            <td>{row.rev2}</td>
                                            <td>{row.rev3}</td>
                                        </tr>
                                    </template>
                                </template>
                            </tbody>
                        </table>
                        <p class="checklist__note">
                            <strong>신규 항목</strong>은 동일 프로젝트·시공 조건 12대의 다음 예방정비부터 필수 점검 대상입니다.
                        </p>
                    </div>
                </section>
            </div>
        </template>
    </div>
</template>
