<template>
    <div class="slds-p-vertical_x-small">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
        </template>

        <template lwc:if={error}>
            <div class="slds-text-color_error slds-p-around_small" role="alert">
                {errorMessage}
            </div>
        </template>

        <template lwc:if={actions}>
            <!-- ── Highlights 헤더 (§2-1 골격, prefix action) ── -->
            <div class="action-hl">
                <div class="action-hl-head">
                    <span class="action-hl-icon">
                        <lightning-icon icon-name="utility:success" size="small"
                            variant="inverse"></lightning-icon>
                    </span>
                    <div class="action-hl-title">
                        <p class="action-hl-eyebrow">승인 범위로 작업 생성됨 · Problem {actions.problemNumber}</p>
                        <h1 class="action-hl-name">대책이 담당자와 기한이 있는 다음 업무가 됐습니다</h1>
                    </div>
                </div>
                <dl class="action-hl-fields">
                    <div class="action-hl-f">
                        <dt>시정조치</dt>
                        <dd class="num">{correctiveCount}건</dd>
                    </div>
                    <div class="action-hl-f">
                        <dt>예방확인</dt>
                        <dd class="num">{preventiveCount}건</dd>
                    </div>
                    <div class="action-hl-f">
                        <dt>합계</dt>
                        <dd class="num">{totalCount}건</dd>
                    </div>
                </dl>
            </div>

            <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                <!-- ── 중앙: 생성된 WO + 점검표 개정 ── -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
                    <lightning-card>
                        <span slot="title" class="slds-text-heading_small">생성된 Work Order</span>
                        <span slot="actions" class="slds-badge source-human">담당자 승인</span>
                        <div class="slds-p-horizontal_small slds-p-bottom_small">
                            <template lwc:if={hasWorkOrders}>
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th scope="col"><div class="slds-truncate">구분</div></th>
                                            <th scope="col"><div class="slds-truncate">WO 번호</div></th>
                                            <th scope="col"><div class="slds-truncate">작업</div></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={workOrders} for:item="wo">
                                            <tr key={wo.workOrderNumber} class="slds-hint-parent">
                                                <td><span class={wo.badgeClass}>{wo.badgeLabel}</span></td>
                                                <th scope="row"><div class="slds-truncate">{wo.workOrderNumber}</div></th>
                                                <td><div class="slds-truncate">{wo.subject}</div></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-body_small slds-text-color_weak">생성된 Work Order가 없습니다.</p>
                            </template>
                        </div>
                    </lightning-card>

                    <lightning-card class="slds-m-top_small">
                        <span slot="title" class="slds-text-heading_small">점검표 개정</span>
                        <span slot="actions" class="slds-badge scope-preventive">Rev.2 → Rev.3</span>
                        <div class="slds-p-horizontal_small slds-p-bottom_small">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col"><div class="slds-truncate">점검 항목</div></th>
                                        <th scope="col"><div class="slds-truncate">Rev.2</div></th>
                                        <th scope="col"><div class="slds-truncate">Rev.3</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={checklistRows} for:item="row">
                                        <tr key={row.key} class="slds-hint-parent">
                                            <th scope="row"><div class="slds-truncate">{row.item}</div></th>
                                            <td><div class="slds-truncate">{row.rev2}</div></td>
                                            <td>
                                                <template lwc:if={row.isNew}>
                                                    <span class="slds-badge scope-new">{row.rev3}</span>
                                                </template>
                                                <template lwc:else>
                                                    <div class="slds-truncate">{row.rev3}</div>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </lightning-card>
                </div>

                <!-- ── 우측 레일: 신규사례 감지 / Article 초안 ── -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                    <lightning-card class="article-card">
                        <span slot="title" class="slds-text-heading_small">신규 사례 감지</span>
                        <span slot="actions" class="slds-badge source-agent">Agent 제안</span>
                        <div class="slds-p-horizontal_small slds-p-bottom_small">
                            <p class="slds-text-body_small article-detect">
                                이번 해결 내용은 기존 Knowledge와 완전히 같은 사례가 아니었습니다.
                                Case와 RCA를 비교해 신규 사례 가능성을 감지했습니다.
                            </p>

                            <div class="article-draft slds-m-top_small slds-p-around_small">
                                <p class="mini-label">Article 초안</p>
                                <p class="article-title">변경 적용 구간의 체결 상태 재발 — 확인 순서와 재점검 기준</p>
                                <dl class="article-kv">
                                    <div class="article-kv-row">
                                        <dt>근거</dt><dd>{evidenceSource}</dd>
                                    </div>
                                    <div class="article-kv-row">
                                        <dt>2022 원기록</dt><dd class="num">{commissionText}</dd>
                                    </div>
                                    <div class="article-kv-row">
                                        <dt>2026 측정</dt><dd class="num">{recoveryText}</dd>
                                    </div>
                                    <div class="article-kv-row">
                                        <dt>공개 범위</dt><dd><span class="slds-badge">검토 필요</span></dd>
                                    </div>
                                </dl>
                            </div>

                            <div class="slds-m-top_small">
                                <lightning-button label="등록 검토" variant="brand"
                                    onclick={handleArticleReview}></lightning-button>
                                <lightning-button label="보류" onclick={handleArticleHold}
                                    class="slds-m-left_xx-small"></lightning-button>
                            </div>
                            <p class="article-note slds-m-top_x-small">
                                자동으로 게시하지 않습니다. 등록 누락을 줄이고 최종 판단은 담당자에게 남깁니다.
                            </p>
                        </div>
                    </lightning-card>
                </div>
            </div>
        </template>
    </div>
</template>
