<template>
    <div class="renewal-wrap">
        <!-- 시간 전환 배너 -->
        <div class="notify">
            <span class="notify-ico">&#x1F4C5;</span>
            <div class="notify-body">
                <b>계약 갱신 검토 구간 진입 · D-61</b> · 2026-07-31 — 갱신 검토를 연 것은 Case 종결이 아니라 계약 종료일(2026-09-30)입니다
            </div>
        </div>

        <!-- 헤더 -->
        <div class="ren-hl">
            <div class="ren-hl-head">
                <span class="ren-hl-icon">R</span>
                <div class="ren-hl-title">
                    <p class="ren-hl-eyebrow">Renewal Flow 생성 · 2026-07-31</p>
                    <h1 class="ren-hl-name">서비스 결과는 계약 운영 성과로 누적됩니다</h1>
                </div>
                <span class="slds-badge ren-badge-rule">Renewal Flow 생성</span>
            </div>
        </div>

        <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
            <!-- My Tasks 목록 -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
                <lightning-card>
                    <span slot="title" class="slds-text-heading_small">My Tasks</span>
                    <span slot="actions" class="slds-badge ren-badge-neutral">3건</span>
                    <div class="slds-p-horizontal_small slds-p-bottom_small">
                        <div class="rl">
                            <div class={renewalRowClass} data-task="renewal" onclick={handleSelectTask}>
                                <span class="slds-badge ren-badge-warn">미착수</span>
                                <div class="rl-main">
                                    <div class="rl-t">아이온데이터 유지보수 계약 갱신 검토</div>
                                    <div class="rl-s">Due 2026-08-01 · Renewal Flow 생성 · Related To SC-2022-0114</div>
                                </div>
                            </div>
                            <div class="rl-row" data-task="quote" onclick={handleSelectTask}>
                                <span class="slds-badge ren-badge-neutral">미착수</span>
                                <div class="rl-main">
                                    <div class="rl-t">세종클라우드 2기 견적 회신</div>
                                    <div class="rl-s">Due 2026-08-03</div>
                                </div>
                            </div>
                            <div class="rl-row" data-task="schedule" onclick={handleSelectTask}>
                                <span class="slds-badge ren-badge-neutral">미착수</span>
                                <div class="rl-main">
                                    <div class="rl-t">대덕리서치 CDU 교체 일정 조율</div>
                                    <div class="rl-s">Due 2026-08-05</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </lightning-card>
            </div>

            <!-- Task 상세 사이드 패널 -->
            <template lwc:if={isRenewalSelected}>
                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3">
                    <lightning-card>
                        <span slot="title" class="slds-text-heading_small">Task 상세</span>
                        <span slot="actions" class="slds-badge ren-badge-rule">Renewal Flow</span>
                        <div class="slds-p-horizontal_small slds-p-bottom_small">
                            <dl class="kv">
                                <div class="kv-row"><dt>Subject</dt><dd>아이온데이터 유지보수 계약 갱신 검토</dd></div>
                                <div class="kv-row"><dt>Assigned To</dt><dd>나세일</dd></div>
                                <div class="kv-row"><dt>Status</dt><dd><span class="slds-badge ren-badge-warn">미착수</span></dd></div>
                                <div class="kv-row"><dt>Due Date</dt><dd class="num">2026-08-01</dd></div>
                                <div class="kv-row"><dt>Account</dt><dd>아이온데이터</dd></div>
                                <div class="kv-row"><dt>계약 종료일</dt><dd class="num">2026-09-30</dd></div>
                                <div class="kv-row"><dt>Related To</dt><dd>SC-2022-0114</dd></div>
                            </dl>
                            <div class="callout co-blue slds-m-top_small">
                                <span class="co-ico">&#x21A6;</span>
                                <div>계약 종료일과 최근 서비스 운영 성과를 확인한 뒤 갱신 진행 여부를 결정하세요.</div>
                            </div>
                            <lightning-button label="Service Contract 열기" variant="brand"
                                onclick={handleOpenContract} class="slds-m-top_small"></lightning-button>
                        </div>
                    </lightning-card>
                </div>
            </template>
        </div>
    </div>
</template>
