<template>
    <div class="slds-p-vertical_x-small">
        <!-- ── Path 바 (프로토타입 v-case, path:0 = 접수 on) ── -->
        <div class="path">
            <div class="path-step on"><span class="path-num">0</span> 접수</div>
            <div class="path-step"><span class="path-num">1</span> 진단·브리핑</div>
            <div class="path-step"><span class="path-num">2</span> 담당자 배정</div>
            <div class="path-step"><span class="path-num">3</span> 현장 출동</div>
            <div class="path-step"><span class="path-num">4</span> 수리·복구</div>
            <div class="path-step"><span class="path-num">5</span> RCA·예방·지식</div>
        </div>

        <!-- ── 서브탭 ── -->
        <div class="subtabs">
            <button class="subtab on">Case</button>
            <button class="subtab" data-goto="c__t5Customer360" onclick={handleSubtab}>Customer 360</button>
            <button class="subtab" data-goto="c__otDispatchBriefingWorkbench" onclick={handleSubtab}>출동 브리핑</button>
            <button class="subtab" data-goto="c__otDispatchCandidates" onclick={handleSubtab}>담당자 확정</button>
            <button class="subtab" data-goto="c__otCauseConfirm" onclick={handleSubtab}>원인확정</button>
            <button class="subtab" data-goto="c__otProblemRca" onclick={handleSubtab}>RCA</button>
            <button class="subtab" data-goto="c__otActionResults" onclick={handleSubtab}>조치</button>
            <button class="subtab">협업 로그</button>
        </div>

        <!-- ── 하이라이트 스트립 ── -->
        <div class="case-hl">
            <div class="case-hl-head">
                <span class="case-hl-icon">C</span>
                <div class="case-hl-title">
                    <p class="case-hl-eyebrow">Case · 아이온데이터</p>
                    <h1 class="case-hl-name">CDU-A-07 유량 저하</h1>
                </div>
                <div class="case-hl-actions">
                    <span class="slds-badge status-badge">상담 중</span>
                    <lightning-button label="출동 브리핑 생성" variant="brand"
                        onclick={handleBriefing} class="slds-m-left_xx-small"></lightning-button>
                </div>
            </div>
            <dl class="case-hl-fields">
                <div class="case-hl-f">
                    <dt>Case 번호</dt>
                    <dd class="num">00001042</dd>
                </div>
                <div class="case-hl-f">
                    <dt>Asset</dt>
                    <dd>CDU-A-07</dd>
                </div>
                <div class="case-hl-f">
                    <dt>Agent 최초 응답</dt>
                    <dd class="num">02:14</dd>
                </div>
                <div class="case-hl-f">
                    <dt>상담사 인수</dt>
                    <dd class="num">02:38</dd>
                </div>
                <div class="case-hl-f">
                    <dt>응답 SLA</dt>
                    <dd class="num">30분</dd>
                </div>
                <div class="case-hl-f">
                    <dt>복구 SLA</dt>
                    <dd class="num">8시간</dd>
                </div>
            </dl>
        </div>

        <!-- 출동 브리핑 생성 Flow 모달 — 회색 backdrop 없이, 밖을 클릭하면 닫힘 -->
        <template lwc:if={showBriefingFlow}>
            <div class="briefing-overlay" onclick={handleOverlayClick}>
                <!-- 로딩 중엔 배경 박스 없이 스피너만 보여준다 -->
                <template lwc:if={flowLoading}>
                    <div class="briefing-spinner">
                        <lightning-spinner alternative-text="로딩 중" size="medium"
                            variant="brand"></lightning-spinner>
                    </div>
                </template>

                <!-- Flow는 statuschange를 위해 항상 DOM에 유지. 로딩 중엔 카드를 숨긴다.
                     카드 안 클릭은 전파를 막아, 밖(overlay) 클릭 시에만 닫힌다. -->
                <div class={cardClass} onclick={stopPropagation}
                    role="dialog" aria-modal="true" aria-label="출동 브리핑 생성">
                    <div class="slds-p-around_medium briefing-card-content">
                        <lightning-flow flow-api-name="Case_Dispatch_Briefing_Generate"
                            flow-input-variables={flowInputVariables}
                            onstatuschange={handleFlowStatusChange}></lightning-flow>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
