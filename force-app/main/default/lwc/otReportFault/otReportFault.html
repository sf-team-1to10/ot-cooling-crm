<template>
    <section class="ot-main">
        <span class="back" role="button" tabindex="0" onclick={handleBack}
            >&larr; 내 자산</span
        >
        <h1>장애 신고</h1>
        <div class="sub">선택한 장비의 장애를 접수합니다</div>

        <!-- Success: created Case number + automation readback -->
        <template lwc:if={hasResult}>
            <div class="card result-card">
                <div class="result-header">
                    <div class="result-icon" aria-hidden="true">✓</div>
                    <div>
                        <div class="result-title">신고가 접수되었습니다.</div>
                        <div class="result-desc">담당 팀에서 검토 후 연락드리겠습니다.</div>
                    </div>
                </div>

                <div class="result-body">
                    <!-- 케이스 번호 (복사 버튼 포함) -->
                    <div class="result-field">
                        <div class="rf-label">신고 번호</div>
                        <div class="rf-value rf-case-row">
                            <span class="case-number">{result.caseNumber}</span>
                            <button
                                class="copy-btn"
                                type="button"
                                title="케이스 번호 복사"
                                onclick={handleCopyCaseNumber}
                            >{copyButtonLabel}</button>
                        </div>
                    </div>

                    <div class="result-field">
                        <div class="rf-label">회사</div>
                        <div class="rf-value">{result.accountName}</div>
                    </div>

                    <div class="result-field">
                        <div class="rf-label">신고자</div>
                        <div class="rf-value">{result.contactName}</div>
                    </div>

                    <div class="result-field">
                        <div class="rf-label">보증 판정</div>
                        <div class="rf-value">
                            <c-ot-status-badge
                                variant={warrantyVariant}
                                label={result.warrantyDecision}
                            ></c-ot-status-badge>
                        </div>
                    </div>

                    <div class="result-field">
                        <div class="rf-label">유상 / 무상</div>
                        <div class="rf-value">
                            <c-ot-status-badge
                                variant={billableVariant}
                                label={billableLabel}
                            ></c-ot-status-badge>
                        </div>
                    </div>

                    <template lwc:if={result.coverageType}>
                        <div class="result-field">
                            <div class="rf-label">보증 범위 유형</div>
                            <div class="rf-value">{result.coverageType}</div>
                        </div>
                    </template>

                    <template lwc:if={result.warrantyEndDateAtRequest}>
                        <div class="result-field">
                            <div class="rf-label">보증 만료일</div>
                            <div class="rf-value">
                                <lightning-formatted-date-time
                                    value={result.warrantyEndDateAtRequest}
                                    year="numeric"
                                    month="2-digit"
                                    day="2-digit"
                                ></lightning-formatted-date-time>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="foot">
                    <button class="btn g" onclick={handleBack}>
                        목록으로 돌아가기
                    </button>
                </div>
            </div>
        </template>

        <!-- Intake form (hidden once a Case is filed) -->
        <template lwc:else>
            <div class="card">
                <!-- ① 어느 장비입니까? -->
                <div class="step">
                    <div class="qn"><i>1</i>어느 장비입니까?</div>

                    <!-- Selected: read-only card (same look for both paths) -->
                    <template lwc:if={hasSelection}>
                        <div class="ctx sel">
                            <div class="sel-main">
                                <b>{selectedName}</b>
                                <template lwc:if={selectedSubline}>
                                    <span class="sel-sub"
                                        >{selectedSubline}</span
                                    >
                                </template>
                            </div>
                            <button
                                class="link"
                                type="button"
                                onclick={handleChangeAsset}
                            >
                                바꾸기
                            </button>
                        </div>
                    </template>

                    <!-- No selection: pick one of the user's assets -->
                    <template lwc:else>
                        <template lwc:if={hasPickList}>
                            <div class="picker">
                                <template
                                    for:each={pickList}
                                    for:item="asset"
                                >
                                    <div
                                        key={asset.assetId}
                                        class="prow"
                                        role="button"
                                        tabindex="0"
                                        data-id={asset.assetId}
                                        onclick={handlePick}
                                    >
                                        <div class="rmain">
                                            <div class="rt">{asset.name}</div>
                                            <template lwc:if={asset.subline}>
                                                <div class="rs">
                                                    {asset.subline}
                                                </div>
                                            </template>
                                        </div>
                                        <div class="chev">&rsaquo;</div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="ctx muted">
                                선택 가능한 장비가 없습니다.
                            </div>
                        </template>
                    </template>
                </div>

                <!-- ② 어떤 증상입니까? -->
                <div class="step">
                    <div class="qn"><i>2</i>어떤 증상입니까?</div>
                    <lightning-combobox
                        variant="label-hidden"
                        placeholder="선택하세요"
                        options={symptomOptions}
                        value={symptomCategory}
                        onchange={handleSymptomChange}
                        required
                    ></lightning-combobox>
                </div>

                <!-- ③ 운영에 미치는 영향은? -->
                <div class="step">
                    <div class="qn"><i>3</i>운영에 미치는 영향은?</div>
                    <lightning-combobox
                        variant="label-hidden"
                        placeholder="선택하세요"
                        options={impactOptions}
                        value={impactLevel}
                        onchange={handleImpactChange}
                        required
                    ></lightning-combobox>
                </div>

                <!-- ④ 상황을 적어주세요 -->
                <div class="step">
                    <div class="qn"><i>4</i>상황을 적어주세요</div>
                    <lightning-textarea
                        variant="label-hidden"
                        value={reportedSymptom}
                        onchange={handleStatementChange}
                        max-length="32000"
                        placeholder="예: 계통 유량 경보. 랙 입구 온도 상승 중"
                        required
                    ></lightning-textarea>
                </div>

                <template lwc:if={error}>
                    <div class="step">
                        <div class="error" role="alert">{error}</div>
                    </div>
                </template>

                <div class="foot">
                    <button
                        class="btn"
                        onclick={handleSubmit}
                        disabled={isSubmitDisabled}
                    >
                        신고 접수
                    </button>
                </div>

                <template lwc:if={isSaving}>
                    <div class="step">
                        <lightning-spinner
                            alternative-text="저장 중"
                            size="small"
                        ></lightning-spinner>
                    </div>
                </template>
            </div>
        </template>
    </section>
</template>
