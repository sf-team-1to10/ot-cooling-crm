<template>
    <template lwc:if={isOpen}>
        <div class="ovl" onclick={handleBackdrop}>
            <div class="modal">
                <div class="mh">
                    <b>서비스 요청</b>
                    <button class="x" onclick={handleClose}>
                        <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor"/></svg>
                    </button>
                </div>
                <div class="mb">
                    <div class="form-group">
                        <label class="form-label">증상 선택</label>
                        <select class="form-select" value={symptom} onchange={handleSymptom}>
                            <option value="">-- 선택하세요 --</option>
                            <option value="유량 저하">유량 저하</option>
                            <option value="온도 이상">온도 이상</option>
                            <option value="소음/진동">소음/진동</option>
                            <option value="냉각 성능 저하">냉각 성능 저하</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">추가 메모</label>
                        <textarea class="form-textarea" placeholder="추가 상황을 입력하세요" value={memo} oninput={handleMemo}></textarea>
                    </div>
                </div>
                <div class="mf">
                    <button class="btn ghost sm" onclick={handleClose}>닫기</button>
                    <button class="btn sm" onclick={handleSubmit}>제출</button>
                </div>
            </div>
        </div>
    </template>
</template>
