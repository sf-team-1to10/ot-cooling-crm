<template>
    <div class="wb">
        <template lwc:if={isLoading}>
            <div class="loading">
                <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={error}>
            <div class="error" role="alert">{errorMessage}</div>
        </template>

        <template lwc:if={evidence}>
            <!-- 헤더 요약 + CTA -->
            <div class="meta">
                <dl class="meta__list">
                    <div class="meta__item">
                        <dt>2022 최초 불합격</dt>
                        <dd class="num">{firstFailValue}</dd>
                    </div>
                    <div class="meta__item">
                        <dt>2022 재시험 합격</dt>
                        <dd class="num">{retestPassValue}</dd>
                    </div>
                    <div class="meta__item">
                        <dt>연결 Case</dt>
                        <dd class="num">{relatedCaseNumber}</dd>
                    </div>
                    <div class="meta__item">
                        <dt>측정 위치</dt>
                        <dd>{measurementPoint}</dd>
                    </div>
                    <div class="meta__item">
                        <dt>작업 완료</dt>
                        <dd class="num">{completedAtText}</dd>
                    </div>
                </dl>
                <div class="meta__actions">
                    <template lwc:if={problemCreated}>
                        <button type="button" class="btn btn--muted" disabled>Problem 생성됨</button>
                        <button type="button" class="btn btn--primary" onclick={handleGoRca}>
                            원인 분석 →
                        </button>
                    </template>
                    <template lwc:else>
                        <button type="button" class="btn btn--primary" onclick={handleCreateProblem}>
                            Problem 생성 · RCA 기록
                        </button>
                    </template>
                </div>
            </div>

            <div class="grid">
                <!-- 좌: 원인 확정 타임라인 -->
                <section class="card col--main">
                    <header class="card__head">
                        <h3 class="card__title">원인 확정 타임라인</h3>
                    </header>
                    <div class="card__body">
                        <template lwc:if={hasTimeline}>
                            <ol class="tl">
                                <template for:each={timeline} for:item="node">
                                    <li key={node.key} class={node.nodeClass}>
                                        <span class="tl-dot" aria-hidden="true"></span>
                                        <div class="tl-content">
                                            <p class="tl-when">{node.whenText}</p>
                                            <p class="tl-what">{node.what}</p>
                                            <p class="tl-detail">{node.detail}</p>
                                            <template lwc:if={node.source}>
                                                <p class="tl-source">{node.source}</p>
                                            </template>
                                        </div>
                                    </li>
                                </template>
                            </ol>
                        </template>
                        <template lwc:else>
                            <p class="empty">타임라인 데이터가 없습니다.</p>
                        </template>
                    </div>
                </section>

                <!-- 우: 오늘의 측정 요약 (2026 장애복구) -->
                <section class="card col--side">
                    <header class="card__head">
                        <h3 class="card__title">오늘의 측정 요약</h3>
                        <template lwc:if={recoveryEyebrow}>
                            <span class="card__eyebrow">{recoveryEyebrow}</span>
                        </template>
                    </header>
                    <div class="card__body">
                        <template lwc:if={hasRecovery}>
                            <div class="rec">
                                <div class="rec__row">
                                    <div class="rec__label">조치 전 체결토크</div>
                                    <div class="rec__val num rec__val--neg">{torqueBefore}</div>
                                </div>
                                <div class="rec__arrow" aria-hidden="true">↓</div>
                                <div class="rec__row">
                                    <div class="rec__label">조치 후 체결토크</div>
                                    <div class="rec__val num rec__val--pos">{torqueAfter}</div>
                                </div>
                                <div class="rec__divider"></div>
                                <div class="rec__row">
                                    <div class="rec__label">조치 후 유량</div>
                                    <div class="rec__val num rec__val--pos">{flowAfter}</div>
                                </div>
                            </div>
                            <p class="rec__note">
                                동일 측정 위치({measurementPoint})에서 2022년 재시험 합격값 {retestPassValue}과
                                2026년 재조임 결과 {torqueAfter} 판정이 이력으로 함께 남았습니다.
                            </p>
                        </template>
                        <template lwc:else>
                            <p class="empty">장애복구 측정 데이터가 아직 없습니다.</p>
                        </template>
                    </div>
                </section>
            </div>
        </template>
    </div>
</template>
