<template>
    <div class="slds-p-vertical_x-small">
        <!-- ── Path 바 (프로토타입 v-c360, 접수 단계) ── -->
        <div class="path">
            <div class="path-step on"><span class="path-num">0</span> 접수</div>
            <div class="path-step"><span class="path-num">1</span> 진단·브리핑</div>
            <div class="path-step"><span class="path-num">2</span> 담당자 배정</div>
            <div class="path-step"><span class="path-num">3</span> 현장 출동</div>
            <div class="path-step"><span class="path-num">4</span> 수리·복구</div>
            <div class="path-step"><span class="path-num">5</span> RCA·예방·지식</div>
        </div>

        <!-- ── 서브탭 (Customer 360 활성) ── -->
        <div class="subtabs">
            <button class="subtab" data-goto="case" onclick={handleSubtab}>Case</button>
            <button class="subtab on">Customer 360</button>
            <button class="subtab" data-goto="c__otDispatchBriefingWorkbench" onclick={handleSubtab}>출동 브리핑</button>
            <button class="subtab" data-goto="c__otDispatchCandidates" onclick={handleSubtab}>담당자 확정</button>
            <button class="subtab" data-goto="c__otCauseConfirm" onclick={handleSubtab}>원인확정</button>
            <button class="subtab" data-goto="c__otProblemRca" onclick={handleSubtab}>RCA</button>
            <button class="subtab" data-goto="c__otActionResults" onclick={handleSubtab}>조치</button>
            <button class="subtab">협업 로그</button>
        </div>

        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
        </template>

        <template lwc:if={error}>
            <div class="slds-text-color_error slds-p-around_small" role="alert">
                {errorMessage}
            </div>
        </template>

        <template lwc:if={data}>
            <!-- ── 하이라이트 ── -->
            <div class="c360-hl">
                <div class="c360-hl-head">
                    <span class="c360-hl-icon">아</span>
                    <div class="c360-hl-title">
                        <p class="c360-hl-eyebrow">Customer 360 · {accountName}</p>
                        <h1 class="c360-hl-name">고객 360 개요</h1>
                    </div>
                    <div class="c360-hl-actions">
                        <lightning-button label="Case로 돌아가기" variant="brand"
                            data-goto="case" onclick={handleSubtab}></lightning-button>
                    </div>
                </div>
            </div>

            <!-- ── 탭바 ── -->
            <div class="c360-tabbar">
                <button class={contractTabClass} data-c360="contract" onclick={handleC360Tab}>계약</button>
                <button class={productTabClass} data-c360="product" onclick={handleC360Tab}>제품</button>
                <button class={problemTabClass} data-c360="problem" onclick={handleC360Tab}>문제 이력</button>
                <button class={salesTabClass} data-c360="sales" onclick={handleC360Tab}>영업 이력</button>
            </div>

            <!-- 계약 -->
            <template lwc:if={isContract}>
                <div class="c360-panel-single">
                    <lightning-card>
                        <span slot="title" class="slds-text-heading_small">계약</span>
                        <div class="slds-p-horizontal_small">
                            <template lwc:if={hasContracts}>
                                <ul class="slds-has-dividers_bottom-space">
                                    <template for:each={contracts} for:item="c">
                                        <li key={c.id} class={c.itemClass}>
                                            <div class="slds-grid slds-grid_align-spread">
                                                <span class="slds-truncate" title={c.name}>{c.name}</span>
                                                <span class={c.badgeClass}>{c.badgeLabel}</span>
                                            </div>
                                            <div class="slds-text-body_small slds-text-color_weak">
                                                <lightning-formatted-text value={c.status}></lightning-formatted-text>
                                                &middot; 만료
                                                <lightning-formatted-date-time value={c.endDate}></lightning-formatted-date-time>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-color_weak slds-p-vertical_x-small">계약 데이터 없음</p>
                            </template>
                        </div>
                    </lightning-card>
                </div>
            </template>

            <!-- 제품 -->
            <template lwc:if={isProduct}>
                <div class="c360-panel-single">
                    <lightning-card>
                        <span slot="title" class="slds-text-heading_small">제품</span>
                        <div class="slds-p-horizontal_small">
                            <template lwc:if={hasAssets}>
                                <ul class="slds-has-dividers_bottom-space">
                                    <template for:each={assets} for:item="a">
                                        <li key={a.id} class="slds-item section-row">
                                            <div class="slds-grid slds-grid_align-spread">
                                                <span class="slds-truncate" title={a.name}>{a.name}</span>
                                                <span class="slds-text-body_small">{a.status}</span>
                                            </div>
                                            <div class="slds-text-body_small slds-text-color_weak">
                                                S/N {a.serialNumber}
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-color_weak slds-p-vertical_x-small">제품 데이터 없음</p>
                            </template>
                        </div>
                    </lightning-card>
                </div>
            </template>

            <!-- 문제 이력 -->
            <template lwc:if={isProblem}>
                <div class="c360-panel-single">
                    <lightning-card>
                        <span slot="title" class="slds-text-heading_small">문제 이력</span>
                        <div class="slds-p-horizontal_small">
                            <template lwc:if={hasPastCases}>
                                <ul class="slds-has-dividers_bottom-space">
                                    <template for:each={pastCases} for:item="pc">
                                        <li key={pc.id} class="slds-item section-row">
                                            <div class="slds-grid slds-grid_align-spread">
                                                <span class="slds-truncate" title={pc.subject}>
                                                    {pc.caseNumber} &middot; {pc.subject}
                                                </span>
                                                <span class="slds-text-body_small">{pc.status}</span>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-color_weak slds-p-vertical_x-small">과거 문제 이력 없음</p>
                            </template>
                        </div>
                    </lightning-card>
                </div>
            </template>

            <!-- 영업 이력 -->
            <template lwc:if={isSales}>
                <div class="c360-panel-single">
                    <lightning-card>
                        <span slot="title" class="slds-text-heading_small">영업 이력</span>
                        <div class="slds-p-horizontal_small">
                            <template lwc:if={hasOpportunities}>
                                <ul class="slds-has-dividers_bottom-space">
                                    <template for:each={opportunities} for:item="o">
                                        <li key={o.id} class="slds-item section-row">
                                            <div class="slds-grid slds-grid_align-spread">
                                                <span class="slds-truncate" title={o.name}>{o.name}</span>
                                                <span class={o.badgeClass}>{o.badgeLabel}</span>
                                            </div>
                                            <div class="slds-text-body_small slds-text-color_weak">
                                                <lightning-formatted-number
                                                    value={o.amount}
                                                    format-style="currency"
                                                    currency-code="KRW">
                                                </lightning-formatted-number>
                                                &middot;
                                                <lightning-formatted-date-time value={o.closeDate}></lightning-formatted-date-time>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-color_weak slds-p-vertical_x-small">영업 이력 없음</p>
                            </template>
                        </div>
                    </lightning-card>
                </div>
            </template>
        </template>
    </div>
</template>
