<template>
    <div class="slds-p-vertical_x-small">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
        </template>

        <template lwc:if={error}>
            <div class="slds-text-color_error slds-p-around_small" role="alert">
                {errorMessage}
            </div>
        </template>

        <template lwc:if={data}>
            <!-- ── 대표 담당자 (Contact 정보는 dynamicHighlights와 별개) ── -->
            <template lwc:if={profile}>
                <div class="c360-profile">
                    <div class="c360-av">{profile.contactInitial}</div>
                    <div class="c360-id">
                        <div class="c360-name">{profile.contactName}</div>
                        <div class="c360-role">{profile.contactRole}</div>
                    </div>
                    <dl class="c360-contact">
                        <div><dt>Email</dt><dd>{contactEmail}</dd></div>
                        <div><dt>Phone</dt><dd class="num">{contactPhone}</dd></div>
                        <div><dt>Address</dt><dd>{contactAddress}</dd></div>
                    </dl>
                </div>
            </template>

            <!-- ── 고객 인사이트 KPI ── -->
            <div class="mini-label">고객 인사이트</div>
            <div class="c360-kpi">
                <div class="c360-kpi-card"><div class="c360-kpi-v c360-kpi-good">{kpiCsat}</div><div class="c360-kpi-l">CSAT</div></div>
                <div class="c360-kpi-card"><div class="c360-kpi-v">{kpiResponseSla}</div><div class="c360-kpi-l">응답 SLA</div></div>
                <div class="c360-kpi-card"><div class="c360-kpi-v c360-kpi-sm">{kpiContractType}</div><div class="c360-kpi-l">계약 유형</div></div>
                <div class="c360-kpi-card"><div class={kpiContractStatusClass}>{kpiContractStatus}</div><div class="c360-kpi-l">{kpiContractExpiry}</div></div>
            </div>

            <!-- ── 탭바 ── -->
            <div class="c360-tabbar">
                <button class={contractTabClass} data-c360="contract" onclick={handleC360Tab}>계약 정보</button>
                <button class={productTabClass} data-c360="product" onclick={handleC360Tab}>제품 이력</button>
                <button class={problemTabClass} data-c360="problem" onclick={handleC360Tab}>문제 이력</button>
                <button class={salesTabClass} data-c360="sales" onclick={handleC360Tab}>Sales History</button>
            </div>

            <!-- 계약 정보 -->
            <template lwc:if={isContract}>
                <div class="c360-panel-single">
                    <div class="card">
                        <div class="card-head"><h3>계약 이력</h3></div>
                        <div class="card-body-tight">
                            <div class="rl rl--aligned">
                                <template lwc:if={hasContracts}>
                                    <template for:each={contracts} for:item="c">
                                        <div key={c.id} class="rl-row">
                                            <div class="rl-main">
                                                <div class="rl-t">{c.name}</div>
                                                <div class="rl-s">{c.status} &middot; 만료 {c.endDateFormatted}</div>
                                            </div>
                                            <div class="rl-badge">
                                                <span class={c.badgeClass}>{c.badgeLabel}</span>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <div class="rl-row"><div class="rl-main"><div class="rl-s">계약 데이터 없음</div></div></div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- 제품 이력 -->
            <template lwc:if={isProduct}>
                <div class="c360-panel-single">
                    <div class="card">
                        <div class="card-head"><h3>제품 이력</h3></div>
                        <div class="card-body-tight">
                            <div class="rl">
                                <template lwc:if={hasAssets}>
                                    <template for:each={assets} for:item="a">
                                        <div key={a.id} class="rl-row">
                                            <div class="rl-main">
                                                <div class="rl-t">{a.name}</div>
                                                <div class="rl-s">S/N {a.serialNumber} &middot; {a.status}</div>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <div class="rl-row"><div class="rl-main"><div class="rl-s">제품 데이터 없음</div></div></div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- 문제 이력 -->
            <template lwc:if={isProblem}>
                <div class="c360-panel-single">
                    <div class="card">
                        <div class="card-head"><h3>문제 이력</h3></div>
                        <div class="card-body-tight">
                            <div class="rl">
                                <template lwc:if={hasPastCases}>
                                    <template for:each={pastCases} for:item="pc">
                                        <div key={pc.id} class="rl-row">
                                            <div class="rl-main">
                                                <div class="rl-t">{pc.caseNumber} &middot; {pc.subject}</div>
                                                <div class="rl-s">{pc.status}</div>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <div class="rl-row"><div class="rl-main"><div class="rl-s">과거 문제 이력 없음</div></div></div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Sales History -->
            <template lwc:if={isSales}>
                <div class="c360-panel-single">
                    <div class="card">
                        <div class="card-head"><h3>Sales History</h3></div>
                        <div class="card-body-tight">
                            <div class="rl rl--aligned">
                                <template lwc:if={hasOpportunities}>
                                    <template for:each={opportunities} for:item="o">
                                        <div key={o.id} class="rl-row">
                                            <div class="rl-main">
                                                <div class="rl-t">{o.name}</div>
                                                <div class="rl-s">
                                                    {o.amountFormatted} &middot; {o.closeDateFormatted}
                                                </div>
                                            </div>
                                            <div class="rl-badge">
                                                <span class={o.badgeClass}>{o.badgeLabel}</span>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <div class="rl-row"><div class="rl-main"><div class="rl-s">영업 이력 없음</div></div></div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </template>
    </div>
</template>
