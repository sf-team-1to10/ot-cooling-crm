<template>
    <section class="ot-main">
        <h1>내 자산</h1>
        <div class="sub">{subheading}</div>

        <!-- Skeleton loading -->
        <template lwc:if={isLoading}>
            <div class="skeleton-grid">
                <div class="skel-card">
                    <div class="skel-accent"></div>
                    <div class="skel-body">
                        <div class="skel-line skel-badge"></div>
                        <div class="skel-line skel-title"></div>
                        <div class="skel-line skel-sub"></div>
                    </div>
                </div>
                <div class="skel-card">
                    <div class="skel-accent"></div>
                    <div class="skel-body">
                        <div class="skel-line skel-badge"></div>
                        <div class="skel-line skel-title"></div>
                        <div class="skel-line skel-sub"></div>
                    </div>
                </div>
                <div class="skel-card">
                    <div class="skel-accent"></div>
                    <div class="skel-body">
                        <div class="skel-line skel-badge"></div>
                        <div class="skel-line skel-title"></div>
                        <div class="skel-line skel-sub"></div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Error -->
        <template lwc:if={error}>
            <div class="card-shell">
                <div class="error" role="alert">{error}</div>
            </div>
        </template>

        <!-- Filter pills + grid (shown whenever the user owns any asset) -->
        <template lwc:if={hasAnyAssets}>
            <div class="tools">
                <button class={allPillClass} onclick={handleShowAll}>
                    전체 {allCount}
                </button>
                <button
                    class={attentionPillClass}
                    onclick={handleShowAttention}
                >
                    주의·이상 {attentionCount}
                </button>
            </div>

            <template lwc:if={hasVisibleAssets}>
                <div class="asset-grid">
                    <template for:each={visibleAssets} for:item="asset">
                        <div
                            key={asset.assetId}
                            class={asset.cardClass}
                            role="button"
                            tabindex="0"
                            data-id={asset.assetId}
                            data-name={asset.name}
                            onclick={handleContact}
                        >
                            <div class={asset.accentClass}></div>
                            <div class="ac-body">
                                <div class="ac-head">
                                    <c-ot-status-badge
                                        variant={asset.badgeVariant}
                                        label={asset.statusLabel}
                                    ></c-ot-status-badge>
                                    <div class="chev">&rsaquo;</div>
                                </div>
                                <div class="ac-name">{asset.name}</div>
                                <div class="ac-sub">{asset.subline}</div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
            <template lwc:if={showNoMatch}>
                <div class="card-shell">
                    <div class="empty">해당하는 장비가 없습니다.</div>
                </div>
            </template>
        </template>

        <!-- Empty state: user owns no assets at all -->
        <template lwc:if={showEmptyState}>
            <div class="card-shell">
                <div class="empty">조회 가능한 자산이 없습니다.</div>
            </div>
        </template>
    </section>
</template>
