<template>
    <aside class="rail">
        <!-- Brand -->
        <div class="brand">
            <img src={logoUrl} alt="OT전자" class="brand-logo" />
        </div>

        <!-- Navigation -->
        <nav class="nav">
            <button class={overviewClass} data-page="overview" onclick={handleNavClick}>
                <svg fill="none" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10" stroke="currentColor"/></svg>
                <span class="nav-label">개요</span>
            </button>
            <button class={equipmentClass} data-page="equipment" onclick={handleNavClick}>
                <svg fill="none" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor"/><path d="M3 9h18M9 9v11" stroke="currentColor"/></svg>
                <span class="nav-label">장비</span>
            </button>
            <button class={alarmsClass} data-page="alarms" onclick={handleNavClick}>
                <svg fill="none" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9L2 18a1.7 1.7 0 001.5 2.5h17A1.7 1.7 0 0022 18L13.7 3.9a1.7 1.7 0 00-3 0z" stroke="currentColor"/></svg>
                <span class="nav-label">알람</span>
            </button>
            <button class={analyticsClass} data-page="analytics" onclick={handleNavClick}>
                <svg fill="none" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6" stroke="currentColor" stroke-linecap="round"/></svg>
                <span class="nav-label">분석</span>
            </button>
            <button class={reportsClass} data-page="reports" onclick={handleNavClick}>
                <svg fill="none" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 3v5h5M8 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V8l-5-5z" stroke="currentColor"/><path d="M8 13h8M8 17h5" stroke="currentColor"/></svg>
                <span class="nav-label">리포트</span>
            </button>
            <button class={maintenanceClass} data-page="maintenance" onclick={handleNavClick}>
                <svg fill="none" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 005.4-5.4l-2.7 2.7-2-2z" stroke="currentColor"/></svg>
                <span class="nav-label">정비</span>
            </button>
            <button class={settingsClass} data-page="settings" onclick={handleNavClick}>
                <svg fill="none" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 01-4 0v-.1A1.6 1.6 0 007 19.3a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 004.7 14H4.5a2 2 0 010-4h.1A1.6 1.6 0 006 7a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 0011 4.7V4.5a2 2 0 014 0v.1A1.6 1.6 0 0017 6a1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1A1.6 1.6 0 0019.3 11h.2a2 2 0 010 4h-.1z" stroke="currentColor"/></svg>
                <span class="nav-label">설정</span>
            </button>
        </nav>

        <div class="spacer"></div>

        <!-- AI Assistant -->
        <div class="assist">
            <button class="assist-box" onclick={handleAssistClick}>
                <span class="assist-glow"></span>
                <img src={coolbitMonitorUrl} alt="쿨빗 AI" class="coolbit-img" />
                <span class="assist-label">
                    <svg viewBox="0 0 24 24" stroke-width="2" fill="none" stroke="#16b8c8">
                        <path d="M12 3l2.1 4.9L19 10l-4.9 2.1L12 17l-2.1-4.9L5 10l4.9-2.1z"/>
                    </svg>
                    AI 상담 <span class="beta-badge">Beta</span>
                </span>
            </button>
        </div>

        <!-- Customer info -->
        <template lwc:if={hasCustomerInfo}>
            <div class="cust">
                <span class="cust-label">고객사</span>
                <b class="cust-name">{customerName}</b>
            </div>
        </template>
    </aside>
</template>
