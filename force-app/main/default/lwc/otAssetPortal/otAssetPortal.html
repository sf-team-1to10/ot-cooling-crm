<template>
    <!-- 상단 헤더 -->
    <c-t5-portal-site-header></c-t5-portal-site-header>

    <!-- 사이드바 + 콘텐츠 -->
    <div class="shell">
        <c-ot-portal-sidebar
            active-page={activePage}
            attention-count={attentionCount}
            onnavigate={handleNavigate}
        ></c-ot-portal-sidebar>

        <main class="content">

            <!-- 개요 대시보드 -->
            <template lwc:if={showOverview}>
                <c-ot-portal-overview onnavigate={handleNavigate}></c-ot-portal-overview>
            </template>

            <!-- 내 자산 목록 -->
            <template lwc:if={showList}>
                <c-ot-my-assets
                    oncontact={handleContact}
                    onattentioncount={handleAttentionCount}
                ></c-ot-my-assets>
            </template>

            <!-- 자산 상세 -->
            <template lwc:if={showDetail}>
                <div class="detail-wrap">
                    <button class="back-link" onclick={handleBackToList}>
                        ← 내 자산
                    </button>
                    <c-ot-trend-alert-card
                        asset-id={selectedAssetId}
                    ></c-ot-trend-alert-card>
                    <button class="report-cta" onclick={handleOpenReport}>
                        이 장비 장애 신고
                    </button>
                </div>
            </template>

            <!-- 장애 신고 -->
            <template lwc:if={showIntake}>
                <c-ot-report-fault
                    asset-id={selectedAssetId}
                    asset-name={selectedAssetName}
                    onback={handleBackFromReport}
                ></c-ot-report-fault>
            </template>

        </main>
    </div>
</template>
