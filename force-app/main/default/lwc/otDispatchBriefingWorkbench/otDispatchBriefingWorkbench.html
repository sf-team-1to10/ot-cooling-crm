<template>
    <div class="wb">
        <!-- ─── 최초 진입: 안내 + 브리핑 생성 버튼 ─── -->
        <template lwc:if={showIntake}>
            <div class="intake">
                <div class="intake__icon" aria-hidden="true">
                    <lightning-icon icon-name="utility:einstein" size="medium" variant="inverse"></lightning-icon>
                </div>
                <h2 class="intake__title">출동 브리핑을 생성하세요</h2>
                <p class="intake__desc">
                    현장 상황·자산 이력·Priority 산정 근거를 한 화면에 요약합니다.<br>
                    아래 버튼을 눌러 브리핑을 시작하세요.
                </p>
                <button type="button" class="btn btn--primary" onclick={handleGenerateBriefing}>
                    출동 브리핑 생성
                </button>
            </div>
        </template>

        <!-- ─── 로딩 ─── -->
        <template lwc:if={isLoading}>
            <div class="loading">
                <lightning-spinner alternative-text="로딩 중" size="small"></lightning-spinner>
            </div>
        </template>

        <!-- ─── 에러 ─── -->
        <template lwc:if={error}>
            <div class="error" role="alert">{errorMessage}</div>
        </template>

        <!-- ─── 브리핑 본문 ─── -->
        <template lwc:if={showBriefing}>
            <!-- 컴포넌트 메타 필드 (표준 하이라이트에 없는 값만) -->
            <div class="meta">
                <dl class="meta__list">
                    <div class="meta__item">
                        <dt>SLA 잔여</dt>
                        <dd class="num">{slaRemaining}</dd>
                    </div>
                    <div class="meta__item">
                        <dt>산정 시각</dt>
                        <dd class="num">{calculatedAtText}</dd>
                    </div>
                    <div class="meta__item">
                        <dt>비교 대상</dt>
                        <dd>Hall A CDU {rationale.comparedCount}대</dd>
                    </div>
                </dl>
                <div class="meta__actions">
                    <button type="button" class="btn btn--primary" onclick={handleSlack}>
                        Slack 전문가 소집
                    </button>
                </div>
            </div>

            <div class="grid">
                <!-- 중앙: Priority 근거 + 12대 비교 -->
                <div class="col col--main">
                    <!-- Priority 산정 근거 -->
                    <section class="card">
                        <header class="card__head">
                            <h3 class="card__title">Priority 산정 근거</h3>
                        </header>
                        <div class="card__body-tight">
                            <table class="tbl">
                                <thead>
                                    <tr>
                                        <th scope="col">산정 인자</th>
                                        <th scope="col">{rationale.maxDriftAssetName} 값</th>
                                        <th scope="col">기여</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={rationaleFactors} for:item="f">
                                        <tr key={f.key}>
                                            <th scope="row">{f.label}</th>
                                            <td>{f.valueText}</td>
                                            <td><span class={f.contributionClass}>{f.contributionText}</span></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <!-- Hall A CDU 12대 비교 -->
                    <section class="card">
                        <header class="card__head">
                            <h3 class="card__title">Hall A CDU 12대 비교</h3>
                        </header>
                        <div class="card__body-tight">
                            <template lwc:if={hasComparisons}>
                                <table class="tbl">
                                    <thead>
                                        <tr>
                                            <th scope="col">장비</th>
                                            <th scope="col">Revision</th>
                                            <th scope="col">현재 유량</th>
                                            <th scope="col">기준선 대비</th>
                                            <th scope="col">추세</th>
                                            <th scope="col">과거 실패</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={comparisonRows} for:item="row">
                                            <tr key={row.key} class={row.rowClass}>
                                                <th scope="row">
                                                    {row.assetName}
                                                    <template lwc:if={row.isTarget}>
                                                        <span class="cmp-pin" aria-label="현재 대상">●</span>
                                                    </template>
                                                </th>
                                                <td>{row.revisionText}</td>
                                                <td class={row.measuredClass}>{row.measuredText}</td>
                                                <td class={row.driftClass}>{row.driftText}</td>
                                                <td>
                                                    <template lwc:if={row.hasTrendChip}>
                                                        <span class={row.trendClass}>{row.trendFlag}</span>
                                                    </template>
                                                    <template lwc:else>—</template>
                                                </td>
                                                <td class={row.failureClass}>{row.pastFailureText}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>
                            <template lwc:else>
                                <p class="empty">비교할 측정 데이터가 없습니다.</p>
                            </template>
                        </div>
                    </section>
                </div>

                <!-- 우측: 우선 점검 후보 + 유사사례 + Trend -->
                <div class="col col--side">
                    <section class="card">
                        <header class="card__head">
                            <h3 class="card__title">우선 점검 후보</h3>
                        </header>
                        <div class="card__body-tight">
                            <template lwc:if={hasBriefingInsights}>
                                <ul class="insights">
                                    <template for:each={briefingInsights} for:item="it">
                                        <li key={it.key} class="insight">
                                            <span class="insight__dot" aria-hidden="true"></span>
                                            <div class="insight__content">
                                                <template lwc:if={it.label}>
                                                    <p class="insight__label">{it.label}</p>
                                                </template>
                                                <p class="insight__body">{it.body}</p>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <p class="empty">브리핑 본문이 아직 생성되지 않았습니다.</p>
                            </template>
                        </div>
                    </section>

                    <section class="card">
                        <header class="card__head">
                            <h3 class="card__title">전사 유사사례</h3>
                        </header>
                        <div class="card__body-tight">
                            <template lwc:if={hasSimilarCaseInsights}>
                                <ul class="insights">
                                    <template for:each={similarCaseInsights} for:item="it">
                                        <li key={it.key} class="insight">
                                            <span class="insight__dot" aria-hidden="true"></span>
                                            <div class="insight__content">
                                                <template lwc:if={it.label}>
                                                    <p class="insight__label">{it.label}</p>
                                                </template>
                                                <p class="insight__body">{it.body}</p>
                                            </div>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template lwc:else>
                                <p class="empty">유사사례 요약이 아직 없습니다.</p>
                            </template>
                        </div>
                    </section>

                    <section class="card">
                        <header class="card__head">
                            <h3 class="card__title">실시간 Trend</h3>
                            <span class="chip chip--warn">주의</span>
                        </header>
                        <div class="card__body">
                            <div class="gauge">
                                <div class="gauge__top">
                                    <span class="gauge__val num">1,961</span>
                                    <span class="gauge__unit">L/min</span>
                                </div>
                                <div class="gauge__bar">
                                    <div class="gauge__fill"></div>
                                    <div class="gauge__mark"></div>
                                </div>
                                <div class="gauge__scale">
                                    <span>1,900</span>
                                    <span>기준선 2,100</span>
                                    <span>2,200</span>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </template>

        <!-- Slack 전문가 소집 Flow 모달 -->
        <template lwc:if={showSwarmFlow}>
            <div class="swarm-overlay" onclick={handleSwarmOverlayClick}>
                <template lwc:if={swarmFlowLoading}>
                    <div class="swarm-spinner">
                        <lightning-spinner alternative-text="로딩 중" size="medium" variant="brand"></lightning-spinner>
                    </div>
                </template>
                <div class={swarmCardClass} onclick={stopPropagation}
                    role="dialog" aria-modal="true" aria-label="Slack 전문가 소집">
                    <div class="slds-p-around_medium">
                        <lightning-flow flow-api-name="T5_Case_Expert_Finder_Swarm"
                            flow-input-variables={swarmFlowInputVariables}
                            onstatuschange={handleSwarmStatusChange}></lightning-flow>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
