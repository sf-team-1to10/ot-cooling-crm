<template>
    <div class="proto-banner">
        <span class="proto-tag">PROTOTYPE</span>
        <span class="proto-text">화면 구조·동선 확인용입니다. 실제 구현은 Experience Cloud(LWR) + LWC. 계측값·알람은 데모 데이터입니다.</span>
    </div>
    <header class="site-header">
        <div class="brand">
            <img src={logoUrl} alt="OT전자" class="brand-logo" />
            <span class="brand-sep">|</span>
            <span class="brand-sub">고객 포털</span>
            <span class="ec-badge">Experience Cloud</span>
        </div>
        <nav class="site-tabs" aria-label="주요 메뉴">
            <button class="active" type="button">내 자산</button>
            <button type="button">장애 신고</button>
            <button type="button">변경 요청</button>
            <button type="button">인수 현황</button>
            <button type="button">정비 현황</button>
        </nav>
        <div class="site-right">
            <div class="user-chip">
                <span class="avatar">👤</span>
                <span class="user-name">{displayName}</span>
            </div>
            <button class="exit-btn" type="button" onclick={handleExit}>홈페이지 나가기</button>
        </div>
    </header>
    <div class={toastClass}>{toastMessage}</div>
</template>
